[project]
name = "local-elections-jharkhand"
version = "1.0.0"
description = "Jharkhand gram panchayat head (mukhiya) reservations and winners, 2015 and 2022"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Jharkhand", "elections", "panchayats", "mukhiya", "reservation", "data"]
dependencies = [
    "numpy>=2.3",
    "opencv-python-headless>=4.12",
    "pandas>=2.3",
    "pdfplumber>=0.11",
    "preclink>=1.2.0",
    "pyarrow>=21",
    "rapidfuzz>=3.14",
]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_jharkhand"
Issues = "https://github.com/in-rolls/local_elections_jharkhand/issues"

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8"]
infer = [
    "indicate>=0.10 ; python_full_version >= '3.13'",
    "naampy>=0.11",
    "scikit-learn>=1.7",
    "litellm>=1.106.0",
]
muse = [
    "scikit-learn>=1.7",
    "museclient @ git+https://github.com/gojiplus/museclient@2063b1b",
]
# Apple Vision (on-device) for reading the scans; macOS only, so parsing the
# cached OCR does not need it.
ocr = ["ocrmac>=1.0 ; sys_platform == 'darwin'"]
# Surya through savitr, for the 2015 scans (extract/ocr_surya_2015.py); Apple
# Silicon only. The parser reads the committed cache, so only regenerating it
# needs this group.
surya = ["savitr==0.3.0"]

[tool.uv]
conflicts = [[{ group = "infer" }, { group = "muse" }]]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
allowed-confusables = ["‘", "’", "‛", "–", "।", "ः", "०", "‐", "−"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_jharkhand"]
